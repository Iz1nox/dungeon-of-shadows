-bar .spell-slot.active{border-color:#ff0;box-shadow:0 0 8px #ff0}#spell-bar .spell-slot .key{position:absolute;top:2px;left:4px;font-size:9px;color:#888}#spell-bar .spell-slot .icon{font-size:20px}#spell-bar .spell-slot .cd-overlay{position:absolute;bottom:0;left:0;width:100%;background:rgba(0,0,0,.7);color:#f88;font-size:10px;text-align:center}#title-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:radial-gradient(ellipse at center,#1a0a2e 0%,#050510 100%);display:flex;flex-direction:column;align-items:center;justify-content:center;color:#ddd;text-align:center}#title-screen h1{font-size:52px;color:#f80;text-shadow:0 0 30px #f80,0 0 60px #a40;margin-bottom:10px;letter-spacing:4px}#title-screen .subtitle{font-size:16px;color:#888;margin-bottom:40px}#title-screen button{padding:14px 40px;font-size:18px;background:linear-gradient(to bottom,#c60,#a40);color:#fff;border:2px solid #f80;border-radius:8px;cursor:pointer;margin:6px;transition:all .2s;text-shadow:1px 1px 2px #000}#title-screen button:hover{background:linear-gradient(to bottom,#f80,#c60);transform:scale(1.05);box-shadow:0 0 20px #f804}#death-screen{position:fixed;top:0;left:0;width:100%;height:100%;z-index:100;background:rgba(10,0,0,.9);display:none;flex-direction:column;align-items:center;justify-content:center;color:#ddd;text-align:center}#death-screen h1{font-size:48px;color:#f00;text-shadow:0 0 30px #f00;margin-bottom:20px}#death-screen button{padding:12px 36px;font-size:16px;background:#800;color:#fff;border:2px solid #f00;border-radius:6px;cursor:pointer;margin-top:20px;transition:all .2s}#death-screen button:hover{background:#a00;transform:scale(1.05)}#level-up-screen{position:fixed;top:50%;left:50%;transform:translate(-50%,-50%);z-index:50;background:rgba(0,10,30,.95);border:2px solid #4af;border-radius:10px;padding:30px;color:#ddd;text-align:center;display:none}#level-up-screen h2{color:#4af;font-size:28px;margin-bottom:15px;text-shadow:0 0 15px #4af}#level-up-screen .
